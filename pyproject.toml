[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wakeword-lab"
version = "0.2.0"
description = "Train a custom openWakeWord wake word from synthetic Piper speech, evaluate it against confusable phrases, and run it live."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Hersh" }]
requires-python = ">=3.10"
keywords = ["wake-word", "openwakeword", "piper", "tts", "speech", "keyword-spotting", "onnx"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tts = ["piper-tts>=1.3"]
train = ["openwakeword>=0.6", "onnxruntime>=1.16", "onnx>=1.14", "torch>=2.1"]
live = ["openwakeword>=0.6", "onnxruntime>=1.16", "sounddevice>=0.4.6", "soxr>=0.3"]
all = ["wakeword-lab[tts,train,live]"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wakeword-lab = "wakeword_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wakeword_lab"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["N806", "N803"]  # X / X_val are conventional ML names

[tool.pytest.ini_options]
testpaths = ["tests"]
